<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/card.css">
  <title>Student Cards</title>
</head>
<body>
  <div class="container">
    <div class="top">
      <h1 class="title">Student Cards</h1>
    </div>
    <div class="content"></div>
  </div>

  <template id="student-card-template">
  <div class="card">
    <div class="card-info">
      <div class="id-section">
        <span>Student ID</span>
        <p class="student-id"></p>
      </div>
      
      <h3 class="name-text"></h3>
      <span class="program-tag"></span>

      <div class="meta-grid">
        <div class="meta-item">
          <label>Age</label>
          <p class="age-val"></p>
        </div>
        <div class="meta-item">
          <label>CNIC</label>
          <p class="cnic-val"></p>
        </div>
      </div>
    </div>

    <div class="card-visuals">
      <div class="img-box">
        <img class="student-img" alt="Student Photo" />
      </div>
      <div class="qr-box">
        <img class="qr-img" alt="QR Code" />
      </div>
    </div>
  </div>
</template>

<script type="module" src="javascript/admin.js"></script>
</body>
</html>
